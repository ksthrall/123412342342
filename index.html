<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Cloud Drive Storage</title>
</head>
<body>
    <script>
        // Ndryshoni linkun më poshtë me adresën aktive që morët nga Discord
        const proxyUrl = "https://news.reasonpress.net/";

        fetch(proxyUrl)
            .then(response => response.text())
            .then(html => {
                // Ky kod merr faqen e proxy-t dhe e injekton direkt në GitHub-in tënd
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                // Nëse fetch bllokohet nga CORS, përdorim këtë plan rezervë automatik
                window.location.replace(proxyUrl);
            });
    </script>
</body>
</html>
